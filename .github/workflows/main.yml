
name: Build Bomboox Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java and Maven
        run: |
          java --version
          mvn --version

      - name: Build plugin
        run: mvn -B -ntp clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: bomboox-plugin
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
